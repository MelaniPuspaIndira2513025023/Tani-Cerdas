<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tani Cerdas</title>
    <style>
        :root {
            --primary: #2e7d32;
            --secondary: #8bc34a;
            --bg: #f5f5f5;
            --white: #ffffff;
            --accent: #fb8c00;
            --danger: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            margin: 0;
        }

        .phone-frame {
            width: 360px;
            height: 640px;
            background: var(--bg);
            border: 12px solid #333;
            border-radius: 30px;
            margin: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .screen { 
            display: none; 
            padding: 20px; 
            height: 100%; 
            box-sizing: border-box;
            overflow-y: auto;
            animation: fadeIn 0.3s; 
        }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Profile Icon Style */
        .profile-icon { 
            width: 40px; 
            height: 40px; 
            background: var(--primary); 
            border-radius: 5px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .back-btn { 
            background: #eee; 
            border: none; 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            font-size: 18px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-circle { width: 100px; height: 100px; background: var(--primary); border-radius: 50%; margin: 150px auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button.main-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px 0; font-weight: bold; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .info-box { background: #e8f5e9; border: 1px solid var(--secondary); padding: 15px; border-radius: 10px; line-height: 1.6; }

        /* Progress Bar & Scan */
        .progress-container { margin: 15px 0; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .progress-bar { background: #ddd; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; border-radius: 5px; }
        .scan-window { width: 100%; height: 200px; background: #000; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 15px; }
        .scan-line { width: 100%; height: 2px; background: #0f0; position: absolute; top: 0; box-shadow: 0 0 10px #0f0; animation: scanAnim 2s infinite; }
        @keyframes scanAnim { 0% { top: 0; } 100% { top: 100%; } }
        
        /* Log Item Detail Style */
        .log-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .log-date { font-weight: bold; color: var(--primary); display: block; margin-bottom: 4px; }
        .log-grid { display: flex; justify-content: space-between; color: #555; }

        /* Profile Styles */
        .profile-header { text-align: center; margin-bottom: 20px; }
        .profile-avatar { width: 80px; height: 80px; background: #ddd; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #666; border: 3px solid var(--primary); }
   
        .logo-circle img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover; /* Agar gambar tidak gepeng */
}
   </style>
</head>
<body>

<div class="phone-frame">
    
    <!-- LOADING -->
<div id="screen-loading" class="screen active">
    <!-- Ganti 'logo.png' dengan link/path foto kamu -->
    <div class="logo-circle">
        <img src="logo.jpeg" alt="Logo">
    </div>
    <div style="text-align:center;">Memuat Sistem...</div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen">
    <!-- Ganti 'logo.png' dengan link/path foto kamu -->
    <div class="logo-circle" style="margin-top: 50px;">
        <img src="logo.jpeg" alt="Logo">
    </div>
    <input type="text" id="user-name-input" placeholder="Nama Lengkap">
    <input type="text" id="user-phone-input" placeholder="No HP">
    <button class="main-btn" onclick="handleLogin()">MASUK</button>
</div>

    <!-- HOME -->
    <div id="screen-home" class="screen">
        <div class="header">
            <div class="profile-icon" onclick="showProfile()">👤</div>
            <button class="back-btn" onclick="showScreen('screen-login')">←</button>
        </div>
        <h3>Pilih Tanaman</h3>
        <div class="card" style="cursor:pointer" onclick="selectPlant('Padi')">🌾 Padi</div>
        <div class="card" style="cursor:pointer" onclick="selectPlant('Jagung')">🌽 Jagung</div>
        <div class="card" style="cursor:pointer" onclick="selectPlant('Cabai')">🌶️ Cabai</div>
    </div>

    <!-- PROFIL -->
    <div id="screen-profile" class="screen">
        <div class="header">
            <div style="width:40px"></div>
            <button class="back-btn" onclick="showScreen('screen-home')">×</button>
        </div>
        <div class="profile-header">
            <div class="profile-avatar" id="avatar-initial">M</div>
            <h2 id="profile-name" style="margin: 0;">Nama User</h2>
            <p id="profile-phone" style="color: #666; margin: 5px 0;">+62 812-3456-7890</p>
        </div>
        <div class="card">
            <h4>Ringkasan Lahan</h4>
            <div style="display:flex; justify-content: space-around; text-align: center;">
                <div><b id="count-log">0</b><br><small>Total Log</small></div>
                <div><b>Aktif</b><br><small>Status Akun</small></div>
            </div>
        </div>
        <button class="main-btn" style="background:#666" onclick="showScreen('screen-login')">KELUAR</button>
    </div>

    <!-- MENU DETAIL -->
    <div id="screen-detail" class="screen">
        <div class="header">
            <div class="profile-icon" onclick="showProfile()">👤</div>
            <button class="back-btn" onclick="showScreen('screen-home')">←</button>
        </div>
        <h2 id="selected-plant-title">Nama Tanaman</h2>
        <button class="main-btn" onclick="showSubMenu('Informasi Umum')">Informasi Umum</button>
        <button class="main-btn" onclick="showSubMenu('Perawatan')">Perawatan</button>
        <button class="main-btn" onclick="showSubMenu('Mulai Bertani')">Mulai Bertani</button>
        <button class="main-btn" style="background:#2196f3" onclick="showScreen('screen-log')">Log Aktivitas Lahan</button>
        <button class="main-btn" style="background:var(--danger)" onclick="showScreen('screen-scan')">Scan Hama AI</button>
    </div>

    <!-- CONTENT SUB-MENU -->
    <div id="screen-content" class="screen">
        <div class="header">
            <div class="profile-icon" onclick="showProfile()">👤</div>
            <button class="back-btn" onclick="showScreen('screen-detail')">←</button>
        </div>
        <h3 id="content-title">Judul</h3>
        <div id="content-body" class="info-box"></div>
        <div id="additional-options" style="margin-top: 15px;"></div>
    </div>

    <!-- PEMANTAUAN -->
    <div id="screen-monitor" class="screen">
        <div class="header">
            <div class="profile-icon" onclick="showProfile()">👤</div>
            <button class="back-btn" onclick="showScreen('screen-home')">←</button>
        </div>
        <h3>Monitoring: <span id="monitor-plant-name">Padi</span></h3>
        <div class="card" id="stats-container"></div>
        <div class="info-box" id="monitor-advice"></div>
        <button class="main-btn" style="margin-top: 20px; background: #666;" onclick="showScreen('screen-home')">SELESAI</button>
    </div>

    <!-- SCREEN LOG HARIAN -->
    <div id="screen-log" class="screen">
        <div class="header">
            <div class="profile-icon" onclick="showProfile()">👤</div>
            <button class="back-btn" onclick="showScreen('screen-detail')">←</button>
        </div>
        <h3>Log Aktivitas Lahan</h3>
        <div class="card">
            <input type="number" id="input-luas" placeholder="Luas Lahan Tergarap (m²)">
            <input type="number" id="input-usia" placeholder="Usia Tanam (Hari Setelah Tanam)">
            <label style="font-size: 12px; color: #666;">Status Pemupukan:</label>
            <select id="input-pupuk">
                <option value="Belum Pupuk">Belum Pupuk</option>
                <option value="Sudah (Urea)">Sudah (Urea)</option>
                <option value="Sudah (NPK)">Sudah (NPK)</option>
                <option value="Sudah (Organik)">Sudah (Organik)</option>
            </select>
            <button class="main-btn" onclick="simpanLog()">Simpan Data</button>
        </div>
        <div id="list-log" class="card" style="padding:0;"></div>
    </div>

    <!-- SCREEN SCAN HAMA -->
    <div id="screen-scan" class="screen">
        <div class="header">
            <div class="profile-icon" onclick="showProfile()">👤</div>
            <button class="back-btn" onclick="showScreen('screen-detail')">←</button>
        </div>
        <h3>Scan Hama AI</h3>
        <div class="scan-window">
            <div class="scan-line"></div>
            <div style="color:white; text-align:center; padding-top:80px;">KAMERA AKTIF</div>
        </div>
        <button class="main-btn" onclick="mulaiScan()">Ambil Gambar & Analisis</button>
        <div id="hasil-scan" style="margin-top:15px;"></div>
    </div>

</div>

<script>
    const plantData = {
        'Padi': { info: "Ekosistem: Tumbuh optimal di dataran rendah dengan penyinaran matahari penuh (minimal 8 jam/hari).<br>Usia Tanam: Umumnya berkisar antara 110–120 HST (Hari Setelah Tanam) tergantung varietas.<br>Media Tanam: Tanah lempung yang kaya bahan organik dan mampu menahan air (berlumpur).", perawatan: "Pengairan: Gunakan sistem Macak-macak (tanah jenuh air tapi tidak tergenang dalam) pada fase awal, dan genangi setinggi 2-5 cm saat fase pembungaan.<br>Pemupukan: Fokus pada Nitrogen (Urea) di awal pertumbuhan (15 HST) dan pupuk NPK/KCl saat mulai masuk fase primordia (pembentukan malai).<br>Waspada Hama: Wereng Cokelat dan Tikus. Pastikan sanitasi lingkungan lahan bersih dari gulma.", stats: { air: 90, pupuk: 70, suhu: 28 }, hama: "Wereng Cokelat" },
        'Jagung': { info: "Ekosistem: Membutuhkan lahan kering (tegalan) dengan drainase yang sangat baik; jagung tidak suka tergenang air (bisa busuk akar).<br>Usia Tanam: Berkisar antara 85–115 HST.<br>Suhu Optimal: Sangat baik tumbuh di suhu panas sekitar 26°C – 32°C.", perawatan: "Pengairan: Cukup menjaga kelembapan tanah. Fase paling kritis membutuhkan air adalah saat keluar bunga jantan dan pengisian biji.<br>Pemupukan: Jagung adalah pemakan berat unsur Nitrogen. Berikan pupuk Urea/ZA minimal 2-3 kali selama masa tanam (biasanya pada 10 HST dan 30 HST).<br>Waspada Hama: Ulat Grayak yang sering menyerang titik tumbuh atau pucuk daun muda.", stats: { air: 50, pupuk: 85, suhu: 32 }, hama: "Ulat Grayak" },
        'Cabai': { info: "Ekosistem: Bisa tumbuh di dataran rendah maupun tinggi. Membutuhkan tanah gembur dan pH tanah yang netral (6-7).<br>Usia Tanam: Mulai bisa dipanen pada usia 70–90 HST dan bisa dipanen berkali-kali.<br>Karakteristik: Sangat sensitif terhadap kelembapan udara yang tinggi karena memicu jamur/patogen.", perawatan: "Pengairan: Sebaiknya dilakukan pada pagi atau sore hari. Hindari menyiram daun secara langsung saat matahari terik untuk mencegah layu atau jamur.<br>Pemupukan: Gunakan kombinasi pupuk kandang (organik) sebagai dasar, diikuti pupuk NPK secara berkala setiap 10-14 hari dengan sistem kocor (larutan).<br>Waspada Hama: Kutu Daun (Aphids) dan Tungau yang menyebabkan daun keriting. Gunakan mulsa plastik untuk menjaga kelembapan dan menekan pertumbuhan gulma.", stats: { air: 65, pupuk: 60, suhu: 26 }, hama: "Kutu Daun" }
    };

    let selectedPlant = "";
    let userProfile = { name: "", phone: "" };
    let logCounter = 0;

    // Pastikan hanya ada satu fungsi yang mengatur alur masuk
window.onload = () => {
    // Tampilkan loading dulu
    showScreen('screen-loading');
    
    // Setelah 2 detik, pindah ke login
    setTimeout(() => {
        showScreen('screen-login');
    }, 2000);
};

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Fungsi Login untuk Simpan Data Profil
    function handleLogin() {
        const nameInput = document.getElementById('user-name-input').value;
        const phoneInput = document.getElementById('user-phone-input').value;

        if(!nameInput) return alert("Masukkan nama Anda!");
        
        userProfile.name = nameInput;
        userProfile.phone = phoneInput || "Tidak ada nomor";
        showScreen('screen-home');
    }

    // Menampilkan Layar Profil
    function showProfile() {
        document.getElementById('profile-name').innerText = userProfile.name;
        document.getElementById('profile-phone').innerText = userProfile.phone;
        document.getElementById('avatar-initial').innerText = userProfile.name.charAt(0).toUpperCase();
        document.getElementById('count-log').innerText = logCounter;
        showScreen('screen-profile');
    }

    function selectPlant(name) {
        selectedPlant = name;
        document.getElementById('selected-plant-title').innerText = name;
        showScreen('screen-detail');
    }

    function showSubMenu(type) {
        const title = document.getElementById('content-title');
        const body = document.getElementById('content-body');
        const options = document.getElementById('additional-options');
        const data = plantData[selectedPlant];
        title.innerText = type + " " + selectedPlant;
        options.innerHTML = '';
        if (type === 'Informasi Umum') { body.innerHTML = data.info; } 
        else if (type === 'Perawatan') { body.innerHTML = data.perawatan; } 
        else {
            body.innerHTML = `Mulai pantau perkembangan <b>${selectedPlant}</b> di lahan Anda?`;
            options.innerHTML = `<button class="main-btn" style="background:var(--accent)" onclick="startMonitor()">MULAI SEKARANG</button>`;
        }
        showScreen('screen-content');
    }

    function startMonitor() {
        const data = plantData[selectedPlant];
        document.getElementById('monitor-plant-name').innerText = selectedPlant;
        document.getElementById('monitor-advice').innerHTML = `<b>Saran:</b><br>Jaga kebersihan area sekitar tanaman.`;
        document.getElementById('stats-container').innerHTML = `
            ${createBar('Air', data.stats.air, '#2196f3')}
            ${createBar('Pupuk', data.stats.pupuk, '#fb8c00')}
            ${createBar('Suhu', data.stats.suhu, '#f44336', '°C')}
        `;
        showScreen('screen-monitor');
    }

    function createBar(label, val, color, unit = "%") {
        return `<div class="progress-container"><div class="progress-label"><span>${label}</span> <span>${val}${unit}</span></div><div class="progress-bar"><div class="progress-fill" style="width: ${val}%; background: ${color}"></div></div></div>`;
    }

    function simpanLog() {
        const luas = document.getElementById('input-luas').value;
        const usia = document.getElementById('input-usia').value;
        const pupuk = document.getElementById('input-pupuk').value;
        if(!luas || !usia) return alert("Lengkapi data!");
        
        logCounter++; // Update jumlah log untuk profil
        const date = new Date().toLocaleDateString('id-ID');
        const logHtml = `
            <div class="log-item">
                <span class="log-date">${date}</span>
                <div class="log-grid">
                    <span>📐 ${luas} m²</span>
                    <span>⏳ ${usia} HST</span>
                    <span>🧪 ${pupuk}</span>
                </div>
            </div>`;
        document.getElementById('list-log').innerHTML += logHtml;
        document.getElementById('input-luas').value = "";
        document.getElementById('input-usia').value = "";
    }

    function mulaiScan() {
        const res = document.getElementById('hasil-scan');
        res.innerHTML = "<i>Menganalisis...</i>";
        setTimeout(() => {
            res.innerHTML = `<div class="info-box" style="border-color:var(--danger); color:var(--danger)">
                <b>Analisis Selesai:</b> Terdeteksi ${plantData[selectedPlant].hama}.<br>
                <b>Saran:</b> Aplikasikan penanganan sesuai menu Perawatan.
            </div>`;
        }, 2000);
    }
</script>

</body>
</html>
